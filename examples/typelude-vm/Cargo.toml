[package]
name = "typelude-vm"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Type-level stack machine for typelude"
license = "MIT"

[features]
default = ["nightly"]
nightly = ["typelude-std/nightly"]

[dependencies]
# typelude-core = { path = "../typelude-core", default-features = false }
typelude-bool = { path = "../typelude-bool", default-features = false }
typelude-col = { path = "../typelude-col", default-features = false }
typelude-std = { path = "../typelude-std", default-features = false }
typenum = { version = "1.19.0", features = ["const-generics"] }
paste = "1.0.15"

[dev-dependencies]
static_assertions = "1.1.0"
typelude-num = { path = "../typelude-num", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
