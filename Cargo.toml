[package]
name = "typelude"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Type-level programming utilities for Rust"
license = "MIT"
keywords = ["type-level", "compile-time", "type-system"]
categories = ["rust-patterns", "no-std"]

[dependencies]
paste = "1.0.15"
seq-macro = "0.3.6"
typenum = { version = "1.18.0", features = ["const-generics"] }

[dev-dependencies]
static_assertions = "1.1.0"
trybuild = "1.0.114"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# グループは低い優先度で
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 型レベルプログラミングでは許容
module_name_repetitions = "allow"
must_use_candidate = "allow"
# 日本語ドキュメントとの相性が悪い
doc_markdown = "allow"
