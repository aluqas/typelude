[package]
name = "typelude-tooling-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "CLI entrypoints for typelude tooling"
license = "MIT"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
typelude-tooling-core = { path = "../typelude-tooling-core" }
typelude-tooling-cargo-profile = { path = "../typelude-tooling-cargo-profile" }
typelude-tooling-rustc = { path = "../typelude-tooling-rustc" }
typelude-tooling-semantic-api = { path = "../typelude-tooling-semantic-api" }
typelude-tooling-typelude = { path = "../typelude-tooling-typelude" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
