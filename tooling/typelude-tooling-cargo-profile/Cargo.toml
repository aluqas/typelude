[package]
name = "typelude-tooling-cargo-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Cargo self-profile and crox analysis for typelude tooling"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
typelude-tooling-core = { path = "../typelude-tooling-core" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
