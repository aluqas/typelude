unstable_features = true
style_edition = "2024"

max_width = 99
tab_spaces = 4
hard_tabs = false
newline_style = "Auto"

indent_style = "Block"

use_small_heuristics = "Off" # Disable small heuristics for consistent formatting
where_single_line = false # Where
overflow_delimited_expr = true # Generics

# impoers
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

