[package]
name = "typelude-tooling-semantic-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Semantic extension API for typelude tooling"
license = "MIT"

[dependencies]
typelude-tooling-core = { path = "../typelude-tooling-core" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
