[package]
name = "typelude-num"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Type-level numeric utilities for typelude"
license = "MIT"

[dependencies]
typelude-std = { path = "../typelude-std" }
typenum = { version = "1.19.0", features = ["const-generics"] }

[dev-dependencies]
static_assertions = "1.1.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
