[package]
name = "typelude-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Core traits and libraries for typelude"
license = "MIT"

[dependencies]
typenum = { version = "1.19.0", features = ["const-generics"] }
hybrid-array = "0.4.5"
const_panic = "0.2.15"
derive_more = { version = "2.1.0", features = ["full"] }
paste = "1.0.15"
tstr = "0.3.0"

[dev-dependencies]
static_assertions = "1.1.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
