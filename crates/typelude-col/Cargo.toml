[package]
name = "typelude-col"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Type-level collection utilities for typelude"
license = "MIT"

[dependencies]
typelude-num = { path = "../typelude-num" }

[dev-dependencies]
static_assertions = "1.1.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
