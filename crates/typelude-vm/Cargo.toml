[package]
name = "typelude-vm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Type-level stack machine for typelude"
license = "MIT"

[features]
default = ["nightly"]
nightly = ["typelude-core/nightly"]

[dependencies]
typelude-core = { path = "../typelude-core", default-features = false }
typenum = { version = "1.19.0", features = ["const-generics"] }
derive_more = { version = "2.1.0", features = ["full"] }
paste = "1.0.15"

[dev-dependencies]
static_assertions = "1.1.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
