[package]
name = "typelude-tooling-typelude"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Typelude-specific semantic adapters and renderers"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
typelude-std = { path = "../typelude-std", default-features = false, features = ["nightly"] }
typelude-vm = { path = "../typelude-vm", default-features = false, features = ["nightly"] }
typelude-tooling-core = { path = "../typelude-tooling-core" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
