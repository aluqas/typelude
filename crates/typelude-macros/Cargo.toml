[package]
name = "typelude-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Procedural macros for typelude"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.96", features = ["full", "extra-traits"] }
quote = "1.0.38"
proc-macro2 = "1.0.93"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[dev-dependencies]
trybuild = "1.0.114"
